[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minuscorrect"
version = "0.2.0"
description = "Systemic Integrity & Closed-Loop Verification Protocol for Autonomous Coding Agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Shubham Veer" }
]
keywords = [
    "ai-agents",
    "autonomous-coding",
    "verification",
    "systemic-integrity",
    "circuit-breaker",
    "claude-code",
    "cursor",
    "antigravity",
    "codex"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/PROGRAMMER-DUMMY/MinusCorrect"
Repository = "https://github.com/PROGRAMMER-DUMMY/MinusCorrect"
Issues = "https://github.com/PROGRAMMER-DUMMY/MinusCorrect/issues"

[project.scripts]
minuscorrect = "minuscorrect.cli:main"
mc-supervisor = "minuscorrect.cli:supervisor_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["minuscorrect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_temp -v"

